; ============================================================
;  MU 5.2 Turbo - Graphics / Post-FX settings
;  Edit a value and restart the client to apply.
;  (Environment variables MU_* override anything set here.)
; ============================================================

[Display]
; Frame-rate cap. This is the single biggest lever for STABLE, even frame pacing.
; Uncapped rendering is what makes FPS swing (sprints to 120 in light scenes, then
; stalls to 40 in crowds) - that swing is what feels like "lag". A fixed ceiling keeps
; frame time consistent, so light scenes hold steady and heavy scenes drop less harshly.
;   60 = rock-solid on any monitor (recommended for stability)
;   72 / 120 / 144 = match your monitor refresh for more fluidity (bigger relative drops)
;   0  = uncapped (old behaviour - max FPS, least stable pacing)
; (Environment variable MU_FRAME_CAP overrides this.)
FrameCap=144

; Multi-box: how many clients may run at once (1-8, default 3). The FIRST client
; runs full quality; every additional client starts in LITE mode automatically
; (SD textures, no PostFX/shadow/water-reflection framebuffers - shown as [LITE]
; next to the FPS counter) so several clients share one GPU without freezing the PC.
MaxClients=3

; Energy save: 1 = a minimized client automatically drops to ~5 visual fps while
; the character keeps playing at full speed (network, combat, MU Helper all run
; normally). Shift+F12 toggles the same mode by hotkey even when not minimized
; (shown as [ECO] next to the FPS counter). 0 = never throttle.
BackgroundSave=1

[PostFX]
; Master switch for the whole post-processing pipeline (bloom + MSAA).
;   1 = on, 0 = off
Enabled=1

; Anti-aliasing (MSAA) sample count. Smooths jagged edges.
;   0 or 1 = off, 2 / 4 / 8 = quality level (4 recommended)
; NOTE: MSAA on the RGBA16F scene FBO is very expensive. With FXAA=1, MSAA=0 is
; recommended for best FPS (FXAA handles edge AA on the final composite).
MSAA=4

; Bloom - soft glow on bright areas (skill effects, torch flames, water highlights).
;   1 = on, 0 = off (MSAA still applies when Bloom=0)
; Lorencia bridge torches need Bloom=1 for the MU MAX Age-style flame halos.
Bloom=1
; Brightness needed before a pixel starts to glow (0.0 - 1.0).
BloomThreshold=0.900
BloomIntensity=0.450
BloomSoftKnee=0.40
BloomPasses=2
; Mip-chain bloom (wide, filmic halos - the MU MAX Age torch look) at LOWER GPU cost
; than the old blur. BloomMips = pyramid depth (2-6; 0 = legacy blur; 5 = default).
; BloomMipScale = scatter percent: how much each level blends toward the wider mip.
; Lower = crisp scene with tight halos, higher = soft dreamy glow (out-of-focus feel).
BloomMips=5
BloomMipScale=60

; HDR tonemap (after bloom, before FXAA). The scene renders in HDR (RGBA16F);
; without this, >1.0 highlights (torch clusters, chrome, additive effects)
; clipped per-channel to white. Operators:
;   softclip = look-preserving (identity below TonemapKnee, highlights roll off) - default
;   aces / filmic = full curves (moodier mids), clamp/off = old behavior
; Exposure scales the scene before the curve (1.0 = neutral).
Tonemap=1
TonemapOperator=softclip
TonemapKnee=0.8
Exposure=1.0
; Color grading LUT (inside the tonemap pass; needs Tonemap=1). Looks:
;   auto   = maxage by day, night grade after dark (follows the server cycle)
;   maxage = warm highlights + teal shadows + contrast (the MU MAX Age film look)
;   night  = cool moody grade    vivid = punchy contrast/saturation
;   neutral / off = no grading
; LUTStrength = percent blend (live-tunable via the graphics reload).
LUT=auto
LUTStrength=45

; FXAA edge anti-aliasing on the final composite (MU_NO_FXAA=1 to disable).
FXAA=1
FXAASharpness=0.65

; Screen-space ambient occlusion (off by default - moderate GPU cost).
SSAO=0
SSAOStrength=0.600
; Render SSAO at half resolution (much faster, barely visible difference).
SSAOHalfRes=1

; Depth of field (subtle defaults - only gentle far-distance softening).
DOF=0
DOFFocalRange=1200
DOFFarMaxBlur=0.22
DOFNearMaxBlur=0.12
DOFFarBlurRange=6000
DOFNearBlurRange=1500
DOFSamples=4

[Shadows]
; 3-cascade directional shadow maps (CSM). Replaces planar blob shadows when on.
;   1 = on, 0 = off  (MU_SHADOWS=1 or MU_NO_SHADOWS=1 override)
Enabled=1
; Shadow map resolution per cascade (512 / 1024 / 2048). 1024 is a good FPS/quality balance.
ShadowMapSize=512
; Temporal cascade staggering: refresh the near cascade every frame, mid every 2nd, far every 3rd.
; Big FPS win (the shadow pass re-draws all casters per cascade); distant shadows refresh slightly
; slower (invisible in motion). 1 = on, 0 = off (MU_NO_SHADOW_STAGGER also disables).
Stagger=1

[TerrainPBR]
; PBR terrain tiles (requires tile VBO path).
;   1 = on, 0 = off  (MU_PBR_TERRAIN=1 override)
Enabled=1
; Lighting balance (live-tunable; defaults = legacy-parity brightness):
;   AmbientStrength      1.0 = flat terrain matches the classic baked lightmap
;   SpecularBoost        analytic-sun specular glints only (diffuse comes from the lightmap)
;   SpecularAmbientBoost extra environment sparkle on metallic tiles
;   RoughnessMax         clamp so rough terrain still shows some highlight
AmbientStrength=1.0
SpecularBoost=1.0
SpecularAmbientBoost=2.0
RoughnessMax=0.6

[Grass]
Enabled=0

[Water]
Enabled=0

[Cloth]
Enabled=1

[Outlines]
Enabled=1
Intensity=120

[Effects]
; Brightness of skill/buff overlay particles drawn after bloom (percent, 10-100).
; Higher = brighter torch flames and additive fire in the reflection pass.
OverlayScale=65
; Soft particles: fade effect quads where they touch ground/walls (no hard
; intersection lines on smoke/fire). Outdoor maps only (needs the scene FBO).
; SoftDistance = world units over which the fade spans (tile = 100).
SoftParticles=1
SoftDistance=60

[Fonts]
MSDF=1

[Sprites]
Modern=1

[Texture]
; Anisotropic filtering - sharpens textures (terrain/ground) at oblique angles.
;   0 = off, 2 / 4 / 8 / 16 = quality level (8 recommended for FPS)
Anisotropic=8

[Debug]
; GPU section timings HUD under the FPS counter (Shadow/Terrain/Objects/Chars/
; Water/PostFX/Effects/UI, ms). Perf gate for render changes. MU_GPU_HUD=1 also
; enables it. Debug-only cost when off (a cached flag check).
GpuHud=0
; CPU phase timers: [CPUPROF] frame/move/render/present ms into CpuProfile.log every
; ~300 frames during normal play (negligible cost). Used to hunt the 200+ FPS goal.
CpuProfile=1
; GL state validator (B4): logs [GLSTATE] divergences to MuError.log once per
; checkpoint+state per map. Passive map coverage - every map you visit gets
; validated. Known-benign: pre-overlay DepthTest (forced right after) + Texture2D.
GlStateCheck=1

[GraphicsV2]
; Atmosphere remaster (sky dome, fog, terrain normals, Lorencia water + fire reflections).
; Outdoor maps only - indoor dungeons (Devil's Tower, BC, DS, CC) use legacy lighting.
; Lorencia only: water reflects sky + torch flames (half-res FBO, refreshed every 2nd frame).
;   1 = on, 0 = off
; (Environment variable MU_GFX2=1 overrides this.)
Enabled=1
; Preset: 0=Day, 1=Sunset, 2=Rain. Press F6 in Lorencia to cycle live.
Preset=0
FogStart=500
FogEnd=3000
Wetness=60
; Water Fresnel / reflection mix (0-100). Higher = stronger fire/sky reflection on Lorencia water.
ReflectionStrength=20
; C10 water: 1 = the reflective water shader runs on ALL outdoor maps (procedural sky
; reflection where there is no FBO: Noria ponds, Tarkan river, ...). 0 = old flat routing.
WaterShader=1
; Sun-glint strength on water, percent (dual-lobe specular; 0 = off, 100 = default).
WaterSpecular=100
; C12 draw list: 2 = cross-model sorted pass (fastest: 221 FPS uncapped measured,
; opaque models sorted by shader/texture, glows keep order), 1 = per-model
; batching, 0 = legacy per-mesh draws (use if models ever misrender).
DrawList=2
; Far Horizon: view distance percent. 100 = classic; 150-250 = terrain reaches much
; farther and DISSOLVES into the sky at the edge (no colored wall).
ViewDistance=160
; Distance-LOD rings (decimate far terrain). OFF by default: LOD2 uses a 2-tile
; grid that visibly shifts mid-distance tiles. Only worth it if FPS drops at
; high ViewDistance values. 1 = on.
TerrainLOD=0
; Metin2-style tile transition feathering: boundaries between different ground
; textures blend smoothly instead of ending in hard square cell edges. Baked
; once per map (a few extra draws) - essentially free. 0 = classic hard tiles.
TileBlend=1

StaticTerrain=1








